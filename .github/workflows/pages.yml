name: Deploy GitHub Pages
# Publishing workflows using GITHUB_TOKEN must explicitly dispatch this workflow after committing.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current published main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Resolve current main before validating and deploying
        run: |
          git fetch origin main
          git checkout --detach origin/main
          echo "Deploying published commit $(git rev-parse HEAD)"
      - name: Validate content
        run: |
          node --check docs/app.js
          node scripts/check.mjs
          python3 scripts/check-xlsx.py
          node --test scripts/*.test.mjs
      - name: Version page assets
        run: node scripts/prepare-pages.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify current published edition and downloads are reachable
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, time, urllib.request
          base=os.environ['PAGE_URL'].rstrip('/') + '/'
          manifest=json.loads(pathlib.Path('docs/editions/index.json').read_text())
          day=manifest['editions'][0]['date']
          week=max(manifest['weeks'])
          events=json.loads(pathlib.Path('docs/events.json').read_text())['updated']
          paths=['editions/index.json',f'editions/{day}.json',f'weeks/{week}.json']
          paths += [manifest[key][period][date].removeprefix('./')
                    for key in ('exports','exportsEn')
                    for period,date in (('day',day),('week',week),('events',events))]
          cache_key=os.popen('git rev-parse --short HEAD').read().strip()
          for attempt in range(12):
            try:
              for path in paths:
                request=urllib.request.Request(base+path+'?v='+cache_key,headers={'Cache-Control':'no-cache'})
                with urllib.request.urlopen(request,timeout=15) as response:
                  raw=response.read()
                  if path.endswith('.xlsx'):
                    assert raw.startswith(b'PK'), 'Invalid remote Excel: '+path
                  elif path=='editions/index.json':
                    remote=json.loads(raw)
                    assert remote['editions'][0]['date']==day, 'Pages is still serving an older edition'
                  else:
                    json.loads(raw)
              print('Verified published edition',day,'and',len(paths),'live assets on',base)
              break
            except Exception as exc:
              if attempt == 11: raise
              print('Pages propagation check',attempt+1,'failed:',exc)
              time.sleep(5)
          PY
