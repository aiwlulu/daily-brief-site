name: Publish Nov 8 Daily Brief with project workbook builder
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/news-publish-2026-11-08.yml

permissions:
  contents: write
  actions: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Python environment for original workbook builder
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check "openpyxl>=3.1.5,<4"
      - name: Materialize verified bilingual edition, weekly digest and calendar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/git/blobs/4edd860c602a77cc65f0d97a69337950a38fb941" --jq '.content' | base64 -d > docs/editions/2026-11-08.json
          gh api "repos/$GITHUB_REPOSITORY/git/blobs/6e6b003756d68f6dbd9a823051d9fb188211ef8a" --jq '.content' | base64 -d > docs/weeks/2026-11-08.json
          gh api "repos/$GITHUB_REPOSITORY/git/blobs/e076e734ce496c2bbc9b0d437bb0be8e90f5931e" --jq '.content' | base64 -d > docs/events.json
      - name: Update edition and weekly manifest and format Chinese content
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          path=Path("docs/editions/index.json")
          data=json.loads(path.read_text())
          date="2026-11-08"
          if any(row["date"]==date for row in data["editions"]):
              raise SystemExit("2026-11-08 already published; no duplicate")
          data["editions"].insert(0,{"date":date,"path":"./editions/2026-11-08.json"})
          data["weeks"]["2026-11-08"]="./weeks/2026-11-08.json"
          path.write_text(json.dumps(data,indent=2,ensure_ascii=False)+"\n")
          PY
          node scripts/format-copy.mjs 2026-11-08
      - name: Generate daily weekly and calendar Excel using original build script
        run: |
          .venv/bin/python scripts/build-workbooks.py "$GITHUB_WORKSPACE" 2026-11-08
          node scripts/check.mjs
          python3 scripts/check-xlsx.py
          node --test scripts/*.test.mjs
      - name: Commit and push all publication files atomically
        run: |
          git config user.name aiwlulu
          git config user.email aiwlulu@users.noreply.github.com
          git rm .github/workflows/news-publish-2026-11-08.yml
          git add docs/editions/2026-11-08.json docs/weeks/2026-11-08.json docs/editions/index.json docs/events.json docs/exports
          git diff --cached --check
          git commit -m "feat(news): publish 2026-11-08 daily brief"
          git push origin HEAD:main
      - name: Start the existing Pages deployment workflow for validated main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
