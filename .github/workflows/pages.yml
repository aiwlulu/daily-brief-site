name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current published main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Resolve current main before validating and deploying
        run: |
          git fetch origin main
          git checkout --detach origin/main
          echo "Deploying published commit $(git rev-parse HEAD)"
      - name: Validate content
        run: |
          node --check docs/app.js
          node scripts/check.mjs
          python3 scripts/check-xlsx.py
          node --test scripts/*.test.mjs
      - name: Version page assets
        run: node scripts/prepare-pages.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

