name: Publish Nov 15 Daily Brief with official workbook builder
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/news-publish-2026-11-15.yml
permissions:
  contents: write
  actions: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Install workbook dependency
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check "openpyxl>=3.1.5,<4"
      - name: Materialize researched bilingual data from GitHub blobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/git/blobs/60bdf7f63bbe811bd3ab69558ed6aaa1d2c3d2aa" --jq '.content' | base64 -d > docs/editions/2026-11-15.json
          gh api "repos/$GITHUB_REPOSITORY/git/blobs/d470da459ee5b868ae966641f80ccbd2b907e316" --jq '.content' | base64 -d > docs/weeks/2026-11-15.json
          gh api "repos/$GITHUB_REPOSITORY/git/blobs/a2c02bd3ec429e2fb57ce90029a4dbcabb5e1a6d" --jq '.content' | base64 -d > docs/events.json
      - name: Update edition manifest and format Chinese typography
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('docs/editions/index.json')
          m=json.loads(p.read_text())
          date='2026-11-15'
          assert not any(x['date']==date for x in m['editions']), 'Existing edition requires revision review'
          m['editions'].insert(0,{'date':date,'path':'./editions/2026-11-15.json'})
          m['weeks'][date]='./weeks/2026-11-15.json'
          p.write_text(json.dumps(m,indent=2,ensure_ascii=False)+'\n')
          PY
          node scripts/format-copy.mjs 2026-11-15
      - name: Generate Excel and validate all archived content
        run: |
          source .venv/bin/activate
          python scripts/build-workbooks.py "$GITHUB_WORKSPACE" events
          python scripts/build-workbooks.py "$GITHUB_WORKSPACE" 2026-11-15
          node --check docs/app.js
          npm test
          git diff --check
      - name: Atomically commit published edition, week, calendar and Excel
        run: |
          git config user.name aiwlulu
          git config user.email aiwlulu@users.noreply.github.com
          git rm .github/workflows/news-publish-2026-11-15.yml
          git add docs/editions/2026-11-15.json docs/editions/index.json docs/weeks/2026-11-15.json docs/events.json docs/exports
          git diff --cached --check
          git commit -m "feat(news): publish 2026-11-15 daily brief"
          git push origin HEAD:main
