name: Publish Nov 13 Daily Brief with official workbook builder
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/news-publish-2026-11-13.yml

permissions:
  contents: write
  actions: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Install official workbook dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check "openpyxl>=3.1.5,<4"
      - name: Materialize researched bilingual edition and weekly digest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/git/blobs/e364d2740d40ccec81261fd5a2c114f6dfccd676" --jq '.content' | base64 -d > docs/editions/2026-11-13.json
          gh api "repos/$GITHUB_REPOSITORY/git/blobs/920a55f568219fdd7346738f823fa099fc8c6e9d" --jq '.content' | base64 -d > docs/weeks/2026-11-08.json
      - name: Reconcile final opened source documents
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("docs/editions/2026-11-13.json")
          data=json.loads(p.read_text())
          mitsui=next(s for s in data["stories"] if s["id"]==4)
          mitsui["sources"]=[s for s in mitsui["sources"] if s["type"]=="First-hand"]
          cheng=next(s for s in data["stories"] if s["id"]==8)
          news="https://www.cna.com.tw/news/afe/202611120316.aspx"
          statement="https://m.esunsec.com.tw/news/instant-detail.aspx?id=%7B1E9A0B24-8253-4FA3-8C3C-6F0C64D9A3FE%7D"
          venue="https://www.moneydj.com/KMDJ/news/newsviewer.aspx?a=af9d7a56-5683-448f-b09e-10a26fb7219f"
          cheng["sources"]=[
            {"name":{"zh":"中央社 · 11 月 12 日誠美材封裝材料法說","en":"CNA · Cheng Mei November 12 packaging materials briefing"},"url":news,"type":"Second-hand"},
            {"name":{"zh":"玉山證券 · 轉載誠美材第三季損益表","en":"E.SUN Securities · Reproduced Cheng Mei Q3 financial statement"},"url":statement,"type":"Source-limited"},
            {"name":{"zh":"MoneyDJ · 轉載法說會場地與時間公告","en":"MoneyDJ · Reproduced investor briefing venue filing"},"url":venue,"type":"Source-limited"}
          ]
          cheng["location"]={
            "zh":"法人說明會場地：台灣台北市忠孝東路二段 95 號 13 樓，兆豐證券 1301 會議室。",
            "en":"Investor briefing venue: Mega Securities, Room 1301, 13F, No. 95, Section 2, Zhongxiao East Road, Taipei, Taiwan."
          }
          for m in cheng["metrics"]:
            m["sourceUrl"]=statement
            m["owner"]={"zh":"誠美材第三季財報，玉山證券轉載","en":"Cheng Mei Q3 filing, reproduced by E.SUN Securities"}
          cheng["summary"]["zh"]=cheng["summary"]["zh"].replace("預計最早 2027 年下半年小量交付；其他封裝製程材料的營收貢獻目標是 2028 年","預計 2027 年下半年至 2028 年逐步交付，現階段仍在客戶驗證")
          cheng["summary"]["en"]=cheng["summary"]["en"].replace("targeting initial small shipments no earlier than H2 2027. Other process materials are aimed at 2028 revenue","targeting initial shipments between H2 2027 and 2028, subject to customer qualification")
          cheng["details"]["zh"] if "details" in cheng else None
          for paragraph in cheng["sections"]:
            if paragraph["label"]["zh"]=="公告數據與時間":
              paragraph["text"]["zh"]=paragraph["text"]["zh"].replace("2027 年下半年才可能小量出貨","2027 年下半年至 2028 年逐步出貨")
              paragraph["text"]["en"]=paragraph["text"]["en"].replace("H2 2027 after several months of testing","H2 2027 through 2028 after qualification")
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+"\n")
          PY
      - name: Update manifest and format Chinese text
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("docs/editions/index.json")
          manifest=json.loads(p.read_text())
          date="2026-11-13"
          assert not any(e["date"]==date for e in manifest["editions"]), "Same edition already exists; requires correction review"
          manifest["editions"].insert(0, {"date":date,"path":"./editions/2026-11-13.json"})
          manifest["weeks"]["2026-11-08"]="./weeks/2026-11-08.json"
          p.write_text(json.dumps(manifest,indent=2,ensure_ascii=False)+"\n")
          PY
          node scripts/format-copy.mjs 2026-11-13
      - name: Generate Excel and run full repository validations
        run: |
          .venv/bin/python scripts/build-workbooks.py "$GITHUB_WORKSPACE" 2026-11-13
          node scripts/check.mjs
          .venv/bin/python scripts/check-xlsx.py
          node --test scripts/*.test.mjs
      - name: Commit all published artifacts atomically
        run: |
          git config user.name aiwlulu
          git config user.email aiwlulu@users.noreply.github.com
          git rm .github/workflows/news-publish-2026-11-13.yml
          git add docs/editions/2026-11-13.json docs/editions/index.json docs/weeks/2026-11-08.json docs/exports
          git diff --cached --check
          git commit -m "feat(news): publish 2026-11-13 daily brief"
          git push origin HEAD:main
      - name: Deploy final published main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
