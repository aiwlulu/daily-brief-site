name: Rebuild Daily Brief Excel exports once
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/news-workbook-repair.yml
permissions:
  contents: write
  actions: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Check out full repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Python environment
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check "openpyxl>=3.1.5,<4"
      - name: Regenerate and validate exports using repository scripts
        run: |
          .venv/bin/python scripts/build-workbooks.py "$GITHUB_WORKSPACE" 2026-11-06
          python3 scripts/check-xlsx.py
          node scripts/check.mjs
          node --test scripts/*.test.mjs
      - name: Commit validated exports and remove this temporary workflow
        run: |
          git config user.name aiwlulu
          git config user.email aiwlulu@users.noreply.github.com
          git rm .github/workflows/news-workbook-repair.yml
          git add docs/exports docs/editions/index.json
          git diff --cached --check
          git commit -m "fix(news): regenerate 2026-11-06 Excel with openpyxl"
          git push origin HEAD:main
      - name: Trigger the normal Pages deployment on repaired main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
