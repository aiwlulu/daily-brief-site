name: Publish Nov 10 Daily Brief using official workbooks
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/news-publish-2026-11-10.yml
permissions:
  contents: write
  actions: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out inspected main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Python and openpyxl
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check "openpyxl>=3.1.5,<4"
      - name: Materialize researched bilingual JSON
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/git/blobs/4e36b8cbce9826066dc542169f4d4d368d165056" --jq '.content' | base64 -d > docs/editions/2026-11-10.json
          gh api "repos/$GITHUB_REPOSITORY/git/blobs/cacb25c602a428c5e71d26b351d2eb013234e7d2" --jq '.content' | base64 -d > docs/weeks/2026-11-08.json
      - name: Update manifest and apply repository typography
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("docs/editions/index.json")
          manifest=json.loads(p.read_text())
          date="2026-11-10"
          assert not any(x["date"]==date for x in manifest["editions"]),"Date already published"
          manifest["editions"].insert(0,{"date":date,"path":"./editions/2026-11-10.json"})
          manifest["weeks"]["2026-11-08"]="./weeks/2026-11-08.json"
          p.write_text(json.dumps(manifest,indent=2,ensure_ascii=False)+"\n")
          PY
          node scripts/format-copy.mjs 2026-11-10
      - name: Generate Excel using project workbook builder and validate
        run: |
          .venv/bin/python scripts/build-workbooks.py "$GITHUB_WORKSPACE" 2026-11-10
          node scripts/check.mjs
          .venv/bin/python scripts/check-xlsx.py
          node --test scripts/*.test.mjs
      - name: Commit final edition week manifest and workbooks atomically
        run: |
          git config user.name aiwlulu
          git config user.email aiwlulu@users.noreply.github.com
          git rm .github/workflows/news-publish-2026-11-10.yml
          git add docs/editions/2026-11-10.json docs/editions/index.json docs/weeks/2026-11-08.json docs/exports
          git diff --cached --check
          git commit -m "feat(news): publish 2026-11-10 daily brief"
          git push origin HEAD:main
      - name: Dispatch existing Pages workflow for final main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
