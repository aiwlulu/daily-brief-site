name: Publish Nov 16 Daily Brief with official workbook builder
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/news-publish-2026-11-16.yml
permissions:
  contents: write
  actions: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Install official workbook dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check "openpyxl>=3.1.5,<4"
      - name: Materialize researched bilingual edition, weekly digest and calendar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/git/blobs/3aa545cc876d4c0c627de80771cffd9d28233c64" --jq '.content' | base64 -d > docs/editions/2026-11-16.json
          gh api "repos/$GITHUB_REPOSITORY/git/blobs/e64f58d5fe43938123884f231a7d44d1e8ce8a8c" --jq '.content' | base64 -d > docs/weeks/2026-11-15.json
          gh api "repos/$GITHUB_REPOSITORY/git/blobs/563f28f8cfee5377cf7814de11d2631945d76070" --jq '.content' | base64 -d > docs/events.json
      - name: Update manifest and format Traditional Chinese
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('docs/editions/index.json')
          m=json.loads(p.read_text())
          date='2026-11-16'
          assert not any(e['date']==date for e in m['editions']), 'Existing edition requires correction review'
          m['editions'].insert(0,{'date':date,'path':'./editions/2026-11-16.json'})
          m['weeks']['2026-11-15']='./weeks/2026-11-15.json'
          p.write_text(json.dumps(m,indent=2,ensure_ascii=False)+'\n')
          PY
          node scripts/format-copy.mjs 2026-11-16
      - name: Generate Excel and run all repository validations
        run: |
          source .venv/bin/activate
          python scripts/build-workbooks.py "$GITHUB_WORKSPACE" events
          python scripts/build-workbooks.py "$GITHUB_WORKSPACE" 2026-11-16
          node --check docs/app.js
          npm test
          git diff --check
      - name: Commit all published artifacts atomically
        run: |
          git config user.name aiwlulu
          git config user.email aiwlulu@users.noreply.github.com
          git rm .github/workflows/news-publish-2026-11-16.yml
          git add docs/editions/2026-11-16.json docs/editions/index.json docs/weeks/2026-11-15.json docs/events.json docs/exports
          git diff --cached --check
          git commit -m "feat(news): publish 2026-11-16 daily brief"
          git push origin HEAD:main
      - name: Deploy final published main explicitly
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
