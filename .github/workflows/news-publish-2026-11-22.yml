name: Publish Nov 22 Daily Brief with official workbook builder
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/news-publish-2026-11-22.yml
permissions:
  contents: write
  actions: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Install workbook dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check "openpyxl>=3.1.5,<4"
      - name: Materialize researched edition, week and calendar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/git/blobs/56efb9e5a622c72bd5e3844a5d09495939beaf71" --jq '.content' | base64 -d > docs/editions/2026-11-22.json
          gh api "repos/$GITHUB_REPOSITORY/git/blobs/e970c41a5b50e9161892edcb650e8939e9573317" --jq '.content' | base64 -d > docs/weeks/2026-11-22.json
          gh api "repos/$GITHUB_REPOSITORY/git/blobs/1849315b3fe2734abb0ca068303f837cda711120" --jq '.content' | base64 -d > docs/events.json
      - name: Update manifest, locale unit and Chinese typography
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('docs/editions/index.json')
          m=json.loads(p.read_text())
          day='2026-11-22'
          assert not any(x['date']==day for x in m['editions']), 'Edition already exists'
          m['editions'].insert(0,{'date':day,'path':'./editions/2026-11-22.json'})
          m['weeks'][day]='./weeks/2026-11-22.json'
          p.write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n')
          path=Path('docs/viz.mjs')
          code=path.read_text()
          anchor="'個國家':'countries','針':'needles','顆':'chips','台':'units',"
          assert code.count(anchor)==1, 'Unexpected metric unit map'
          code=code.replace(anchor,anchor[:-1]+",'支':'cylinders',")
          path.write_text(code)
          PY
          node scripts/format-copy.mjs 2026-11-22
      - name: Generate Excel and run all repository validations
        run: |
          source .venv/bin/activate
          python scripts/build-workbooks.py "$GITHUB_WORKSPACE" events
          python scripts/build-workbooks.py "$GITHUB_WORKSPACE" 2026-11-22
          node --check docs/app.js
          npm test
          git diff --check
      - name: Commit all published artifacts atomically
        run: |
          git config user.name aiwlulu
          git config user.email aiwlulu@users.noreply.github.com
          git rm .github/workflows/news-publish-2026-11-22.yml
          git add docs/editions/2026-11-22.json docs/editions/index.json docs/weeks/2026-11-22.json docs/events.json docs/exports docs/viz.mjs
          git diff --cached --check
          git commit -m "feat(news): publish 2026-11-22 daily brief"
          git push origin HEAD:main
      - name: Deploy latest published main explicitly
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
